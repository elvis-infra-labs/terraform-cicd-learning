name: Terraform CI/CD

on:
  push:
    branches: [ main ]       # triggers on merge to main
  pull_request:
    branches: [ main ]       # triggers on PR to main

env:
  TF_VERSION: "1.9.5"

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      # 1. Get your code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Terraform on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 3. Authenticate with AWS using GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 4. Check formatting — fails if code isn't properly formatted
      - name: Terraform Format Check
        run: terraform fmt -check

      # 5. Download providers, configure backend
      - name: Terraform Init
        run: terraform init

      # 6. Validate syntax and config
      - name: Terraform Validate
        run: terraform validate

      # 7. Show what WILL change — runs on EVERY trigger (PR + push)
      - name: Terraform Plan
        run: terraform plan -no-color

      # 8. Actually apply — ONLY on push to main (merge), NOT on PR
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -no-color
